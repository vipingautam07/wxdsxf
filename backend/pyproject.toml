[project]
name = "windscope-backend"
version = "0.1.0"
description = "Point-in-time GB wind forecast intelligence"
requires-python = ">=3.12,<3.15"
dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "certifi==2026.10.23",
    "click==8.5.0",
    "fastapi==0.162.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.20",
    "numpy==2.5.4",
    "opentelemetry-api==1.45.1",
    "pandas==3.1.0",
    "pydantic==2.14.1",
    "pydantic-core==2.50.1",
    "python-dateutil==3.0.0",
    "six==1.17.0",
    "starlette==1.10.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "tzdata==2026.5",
    "uvicorn==0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.vercel]
entrypoint = "app.main:app"
